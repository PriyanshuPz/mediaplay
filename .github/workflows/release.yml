name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (format: 0.0.0)"
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/priyanshupz/mediaplay

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: 386
          - os: linux
            arch: arm
            variant: v6
          - os: linux
            arch: arm
            variant: v7
          - os: windows
            arch: amd64
          - os: windows
            arch: 386

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          set -e

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            echo "Invalid trigger context"
            exit 1
          fi

          # validate semver (strict x.y.z)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION (expected x.y.z)"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"

      - uses: docker/setup-buildx-action@v3
      - name: Build binary
        run: |
          rm -rf dist artifacts
          mkdir -p dist artifacts

          docker buildx build \
            --platform=linux/amd64 \
            --build-arg VERSION=${VERSION} \
            --build-arg TARGETOS=${{ matrix.os }} \
            --build-arg TARGETARCH=${{ matrix.arch }} \
            --build-arg TARGETVARIANT=${{ matrix.variant || '' }} \
            --output type=local,dest=dist .

      - name: Rename binary
        run: |
          FILE=$(find dist -type f | head -n 1)

          NAME="mediaplay-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.variant }}" != "" ]; then
            NAME="${NAME}-${{ matrix.variant }}"
          fi

          if [ "${{ matrix.os }}" = "windows" ]; then
            mv "$FILE" "artifacts/${NAME}.exe"
          else
            mv "$FILE" "artifacts/${NAME}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.variant || '' }}
          path: artifacts/*

  release:
    needs: build-binaries
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Set version + tag
        run: |
          set -e

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          TAG="v$VERSION"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Generate changelog
        run: |
          set -e

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            RANGE=""
            echo "No previous tag found, using full history"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          echo "## Changes" > CHANGELOG.md

          if [ -z "$RANGE" ]; then
            git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
          else
            git log $RANGE --pretty=format:"- %s (%h)" >> CHANGELOG.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body_path: CHANGELOG.md
          files: release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push multi-arch image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --build-arg VERSION=${VERSION} \
            -t ${IMAGE_NAME}:latest \
            -t ${IMAGE_NAME}:${VERSION} \
            --provenance=true \
            --sbom=true \
            --attest type=provenance,mode=max \
            --attest type=sbom \
            --push .
