name: Release

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-binaries:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: 386
          - os: linux
            arch: arm
            variant: v6
          - os: linux
            arch: arm
            variant: v7

          - os: windows
            arch: amd64
          - os: windows
            arch: 386

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - name: Build binary
        run: |
          mkdir -p dist

          docker buildx build \
            --platform=linux/amd64 \
            --build-arg VERSION=${VERSION} \
            --build-arg TARGETOS=${{ matrix.os }} \
            --build-arg TARGETARCH=${{ matrix.arch }} \
            --build-arg TARGETVARIANT=${{ matrix.variant || '' }} \
            --output type=local,dest=dist .

      - name: Rename binary
        run: |
          mkdir -p artifacts

          NAME="mediaplay-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.variant }}" != "" ]; then
            NAME="${NAME}-${{ matrix.variant }}"
          fi

          if [ "${{ matrix.os }}" = "windows" ]; then
            mv dist/out/* "artifacts/${NAME}.exe"
          else
            mv dist/out/* "artifacts/${NAME}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.variant || '' }}
          path: artifacts/*

  release:
    needs: build-binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push multi-arch image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --build-arg VERSION=${VERSION} \
            -t ${IMAGE_NAME}:latest \
            -t ${IMAGE_NAME}:${VERSION} \
            --push .
